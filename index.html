<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熊猫数据流 PandaFlow · 可视化数据分析全过程</title>
<meta name="description" content="A bilingual, themeable playground that visualises pandas operations step by step — 以动态交互动画逐步呈现 pandas 数据处理全过程，并与图表、统计、相关性视图实时联动。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c7cf5'/%3E%3Cpath d='M9 23V11h6a4 4 0 010 8H9' stroke='%230d0d1a' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles/theme.css">
<link rel="stylesheet" href="styles/data.css">
<link rel="stylesheet" href="styles/views.css">
</head>
<body>

<div class="app" id="app">

  <!-- ============================ 顶栏 ============================ -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 19V6h5a4 4 0 010 8H7"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name" data-i18n="brand.name">熊猫数据流</div>
        <div class="brand-sub">PandaFlow</div>
      </div>
    </div>

    <div class="top-sep"></div>

    <button class="file-chip" id="dsChip" title="">
      <span class="dot"></span>
      <span class="nm" id="dsName">—</span>
      <span class="meta" id="dsMeta">—</span>
    </button>

    <div class="top-spacer"></div>

    <button class="btn sm" id="btnDemo" title="">✦ <span id="btnDemoLabel">一键演示</span></button>
    <button class="btn sm" id="btnUndo" title="">↶ <span id="btnUndoLabel">撤销</span></button>
    <button class="btn sm" id="btnReset" title="">↺ <span id="btnResetLabel">重置</span></button>

    <div class="top-sep"></div>

    <button class="btn sm" id="btnTheme" title="">
      <span id="themeIcon"></span><span id="themeLabel"></span>
    </button>
    <button class="btn sm" id="btnLang" title="">
      <span id="langLabel">EN</span>
    </button>

    <div class="top-sep"></div>
    <button class="btn ghost icon sm" id="btnLeft" title="">◧</button>
    <button class="btn ghost icon sm" id="btnRight" title="">◨</button>
  </header>

  <!-- ============================ 左栏 ============================ -->
  <aside class="sidebar" id="sidebar">
    <section class="panel palette-panel">
      <div class="panel-head">
        <div class="panel-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2l9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 17l9 5 9-5"/></svg>
          <span id="libTitle">操作库</span>
        </div>
        <div class="top-spacer"></div>
        <span class="badge" id="opCount">—</span>
      </div>
      <div class="panel-body" id="palette"></div>
    </section>

    <section class="panel pipeline-panel">
      <div class="panel-head">
        <div class="panel-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5h18M3 12h18M3 19h18"/></svg>
          <span id="pipeTitle">处理管道</span>
        </div>
        <div class="top-spacer"></div>
        <span class="badge accent" id="pipeCount">0</span>
      </div>
      <div class="panel-body" id="pipeline"></div>
    </section>
  </aside>

  <!-- ============================ 中栏 ============================ -->
  <main class="center">

    <section class="panel stage-panel">
      <div class="stage-head" id="stHead" data-tone="info">
        <span class="stage-phase" id="stPhase">—</span>
        <div class="stage-title" id="stTitle">—</div>
        <div class="stage-hud" id="stHud"></div>
      </div>
      <div class="stage-body" id="stage"></div>

      <div class="narration" id="narr" data-tone="info">
        <div class="narration-icon" id="narrIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 16v-4M12 8h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <div class="narration-text" id="narrText"></div>
        <div class="codebox" id="codebox">
          <div class="codebox-head">
            <span class="codebox-dot" style="background:var(--max)"></span>
            <span class="codebox-dot" style="background:var(--warn)"></span>
            <span class="codebox-dot" style="background:var(--ok)"></span>
            <span class="codebox-title" id="codeTitle">pandas 等价代码</span>
          </div>
          <div class="codebox-body" id="codeBody"></div>
        </div>
      </div>
    </section>

    <!-- 分析视图：数据表 / 图表 / 统计 / 缺失值 / 相关性 -->
    <section class="panel view-panel" id="viewPanel"></section>

    <div class="transport">
      <div class="tp-btns">
        <button class="btn ghost icon sm" id="tpFirst">⏮</button>
        <button class="btn ghost icon sm" id="tpPrev">◀</button>
        <button class="tp-play" id="tpPlay">
          <svg id="tpPlayIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l12 8-12 8V4z"/></svg>
        </button>
        <button class="btn ghost icon sm" id="tpNext">▶</button>
        <button class="btn ghost icon sm" id="tpLast">⏭</button>
      </div>
      <div class="tp-progress">
        <div class="tp-track" id="tpTrack">
          <div class="tp-fill" id="tpFill"></div>
          <div class="tp-marks" id="tpMarks"></div>
        </div>
      </div>
      <div class="tp-file"><b id="tpStep">0</b> / <span id="tpTotal">0</span> <span id="tpFrames">帧</span></div>
      <div class="tp-speed">
        <span class="tp-file" id="tpSpeedLabel">速度</span>
        <div class="speed-pills" id="tpSpeed"></div>
      </div>
    </div>
  </main>

  <!-- ============================ 右栏 ============================ -->
  <aside class="inspector" id="inspector">
    <section class="panel insp-dataset">
      <div class="panel-head">
        <div class="panel-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="5.5" rx="8" ry="2.5"/><path d="M4 5.5v13C4 19.9 7.6 21 12 21s8-1.1 8-2.5v-13M4 12c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5"/></svg>
          <span id="inspDatasetTitle">数据集</span>
        </div>
        <div class="top-spacer"></div>
        <button class="btn ghost sm" id="btnImport">—</button>
      </div>
      <div class="panel-body" id="inspDataset"></div>
    </section>

    <section class="panel insp-stats">
      <div class="panel-head">
        <div class="panel-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 4H6l6 8-6 8h12"/></svg>
          <span id="inspStatsTitle">describe 实时摘要</span>
        </div>
        <div class="top-spacer"></div>
        <span class="badge" id="statHint">—</span>
      </div>
      <div class="panel-body" id="inspStats"></div>
    </section>

    <section class="panel insp-dist">
      <div class="panel-head">
        <div class="panel-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V9h3v11M10 20V4h3v16M16 20v-7h3v7M2 20h20"/></svg>
          <span id="inspDistTitle">分布速览</span>
        </div>
        <div class="top-spacer"></div>
      </div>
      <div class="sel-row">
        <span class="sel-label" id="inspDistCol">列</span>
        <select class="sel" id="chartCol"></select>
      </div>
      <div class="panel-body" id="inspChart"></div>
    </section>
  </aside>
</div>

<!-- ============================ 启动引导 ============================ -->
<div class="boot" id="boot">
  <div class="boot-inner">
    <div class="boot-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 19V6h5a4 4 0 010 8H7"/>
      </svg>
    </div>
    <div class="boot-title" id="bootTitle">熊猫数据流 PandaFlow</div>
    <div class="boot-sub" id="bootSub"></div>
    <div class="boot-feats" id="bootFeats"></div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-start">
      <button class="btn primary" id="bootStart">—</button>
      <button class="btn" id="bootDemo">✦ <span id="bootDemoLabel">—</span></button>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
